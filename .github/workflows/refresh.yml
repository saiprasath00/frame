name: Refresh directory and deploy

# Refreshes site/links.json, commits it, then deploys site/ to Vercel.
# Uses VERCEL_TOKEN because this Vercel project is not Git-connected.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # Four checks daily, offset to avoid top-of-hour load.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'vercel.json'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      # A broken upstream must never overwrite the catalogue with an empty one,
      # so the offline tests gate the sync.
      - name: Run synchronizer tests
        run: python -m unittest discover -s tests -v
      - name: Check for added, changed or removed destinations
        run: python scripts/sync_links.py

      - name: Commit the refreshed catalogue
        run: |
          if git diff --quiet -- site/links.json; then
            echo "No listing changes."
            exit 0
          fi
          git config user.name "directory-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/links.json
          git commit -m "Refresh direct website links"
          git push

      - name: Deploy to Vercel
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --cwd site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_gXX4tdT2H18t4UXB7Ajk6cuW
          VERCEL_PROJECT_ID: prj_U4mpHZzJX2CjrQ3RZFN6NoIFS5yl
