name: Refresh directory

# Refreshes site/links.json and commits it. Vercel's Git integration then
# redeploys automatically, so this workflow never deploys anything itself.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # Four checks daily, offset to avoid top-of-hour load.

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Run synchronizer tests
        run: python -m unittest discover -s tests -v
      - name: Check for added, changed or removed destinations
        run: python scripts/sync_links.py
      - name: Commit the refreshed catalogue
        run: |
          if git diff --quiet -- site/links.json; then
            echo "No listing changes."
            exit 0
          fi
          git config user.name "directory-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/links.json
          git commit -m "Refresh direct website links"
          git push
