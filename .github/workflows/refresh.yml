name: Refresh directory and deploy

# Catalogue maintenance only. Deployment is handled by the canonical repo,
# Dailyverse0001/frame-links-directory, which Vercel builds from Git on every
# push to main. This repository's Vercel project now serves a redirect to
# https://frame-links-directory.vercel.app, so no token deploy is needed here.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # Four checks daily, offset to avoid top-of-hour load.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      # A broken upstream must never overwrite the catalogue with an empty one,
      # so the offline tests gate the sync.
      - name: Run synchronizer tests
        run: python -m unittest discover -s tests -v
      - name: Check for added, changed or removed destinations
        run: python scripts/sync_links.py

      - name: Commit the refreshed catalogue
        run: |
          if git diff --quiet -- site/links.json; then
            echo "No listing changes."
            exit 0
          fi
          git config user.name "directory-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/links.json
          git commit -m "Refresh direct website links"
          git push